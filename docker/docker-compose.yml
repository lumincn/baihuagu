services:
  family:
    build:
      context: ..
      dockerfile: docker/Dockerfile.family
      args:
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
        - GIT_BRANCH=${GIT_BRANCH:-unknown}
    image: bh-family:latest
    container_name: bh-family
    restart: unless-stopped
    # 使用 host 网络：WebUI 可直接通过 127.0.0.1:8788 访问 Baihua.Family，
    # 且 nginx 反向代理配置无需修改。
    # 家庭版需 host 网络，以便 mDNS 服务发现在局域网中正常工作。
    network_mode: host
    user: "${USER_UID:-0}:${USER_GID:-0}"
    volumes:
      # 数据持久化到宿主机（SQLite 数据库、配置）
      - /opt/baihua/data:/app/data
      # 日志持久化到宿主机
      - /opt/baihua/logs:/app/logs
      # 可选：宿主机自定义配置覆盖容器内配置（只读）
      - /opt/baihua/config/family:/app/config:ro
      # 知识库根路径（宿主机 VAULTS_DIR → 容器内固定 /vaults）
      - ${VAULTS_DIR:-/home/lumin/Vaults}:/vaults
    environment:
      - BAIHUA_HOME=/app/data
      - BAIHUA_SKIP_MUTEX=true
      - ASPNETCORE_URLS=http://0.0.0.0:8788
      # OpenObserve 通过宿主机 localhost 访问
      - OpenObserve__WebUrl=http://127.0.0.1:5082/
      - OpenObserve__Enabled=true
      # 知识库根路径（容器内挂载点）
      - BAIHUA_VAULT_ROOT=/vaults
      # 固定加密密钥（可选）
      # 程序会自动在 /app/data/db/.baihua-key 生成并管理密钥，容器重建后仍然可用
      # 高级用户可通过环境变量手动指定，覆盖自动生成的密钥
      # 如果设置后更改，已加密的 API Key 会失效，需要重新在 WebUI 配置
      - BAIHUA_ENCRYPTION_KEY=${BAIHUA_ENCRYPTION_KEY:-}
      # 从 .env 文件注入敏感配置
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      # 移动端 HMAC 签名密钥（配对后自动生成，通常无需手动配置）
      - MobileAuth__SharedSecret=${MOBILE_AUTH_SECRET:-}
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8788/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  webui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.webui
      args:
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
        - GIT_BRANCH=${GIT_BRANCH:-unknown}
    image: bh-webui:latest
    container_name: bh-webui
    restart: unless-stopped
    network_mode: host
    user: "${USER_UID:-0}:${USER_GID:-0}"
    volumes:
      - /opt/baihua/data:/app/data
      - /opt/baihua/logs:/app/logs
      - /opt/baihua/config/webui:/app/config:ro
      # 知识库路径（WebUI 需要在容器内验证路径是否存在）
      - ${VAULTS_DIR:-/home/lumin/Vaults}:/vaults
    environment:
      - WEBUI_CONFIG_DIR=/app/data
      - ASPNETCORE_URLS=http://0.0.0.0:5177
      # 通过宿主机 localhost 访问 Baihua.Family（host 网络）
      - FamilyApi__BaseUrl=http://127.0.0.1:8788/
      - AiApi__BaseUrl=http://127.0.0.1:8791/
      - VaultApi__BaseUrl=http://127.0.0.1:8790/
      - OpenObserve__WebUrl=http://127.0.0.1:5082/
      - OpenObserve__Enabled=true
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - ADMIN_IP_WHITELIST=${ADMIN_IP_WHITELIST:-}
    depends_on:
      family:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5177/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    container_name: bh-nginx
    restart: unless-stopped
    network_mode: host             # 保持 host 网络：能直连 127.0.0.1 四个服务
    volumes:
      # 模板文件（含 ${BAIHUA_*} 变量，由 entrypoint envsubst 渲染）
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      # 公共 include（静态，无变量）
      - ./nginx/family-proxy-headers.conf:/etc/nginx/family-proxy-headers.conf:ro
      # 对外访问日志（排查配对/同步问题时有用），与 .NET 日志同根
      - ${BAIHUA_HOME:-/opt/baihua}/logs/nginx:/var/log/nginx
    environment:
      # 传给 entrypoint envsubst 的变量，必须白名单列出
      - BAIHUA_NGINX_PORT=${BAIHUA_NGINX_PORT:-80}
      - BAIHUA_WEBUI_PREFIX=${BAIHUA_WEBUI_PREFIX:-}
      - BAIHUA_NGINX_CLIENT_MAX_BODY_SIZE=${BAIHUA_NGINX_CLIENT_MAX_BODY_SIZE:-100M}
      - NGINX_ENVSUBST_FILTER=^BAIHUA_   # 官方 entrypoint 只替换 BAIHUA_* 前缀
    depends_on:
      family:
        condition: service_healthy
      vault:
        condition: service_healthy
      webui:
        condition: service_healthy
    healthcheck:
      # 探测 nginx 自身是否响应（根路径由 WebUI location 处理，200/404 都说明 nginx 活着）
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:${BAIHUA_NGINX_PORT:-80}/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  vault:
    build:
      context: ..
      dockerfile: docker/Dockerfile.vault
      args:
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
        - GIT_BRANCH=${GIT_BRANCH:-unknown}
    image: bh-vault:latest
    container_name: bh-vault
    restart: unless-stopped
    network_mode: host
    user: "${USER_UID:-0}:${USER_GID:-0}"
    volumes:
      - /opt/baihua/data:/app/data
      - /opt/baihua/logs:/app/logs
      - /opt/baihua/config/vault:/app/config:ro
      - ${VAULTS_DIR:-/home/lumin/Vaults}:/vaults
    environment:
      - BAIHUA_HOME=/app/data
      - ASPNETCORE_URLS=http://0.0.0.0:8790
      - OpenObserve__WebUrl=http://127.0.0.1:5082/
      - OpenObserve__Enabled=true
      - BAIHUA_VAULT_ROOT=/vaults
      - BAIHUA_ENCRYPTION_KEY=${BAIHUA_ENCRYPTION_KEY:-}
      - MobileAuth__SharedSecret=${MOBILE_AUTH_SECRET:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8790/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ai:
    # ai 默认不进容器（Windows 下 native 跑以获取 GPU；Linux 部署用 --profile docker-ai 启用）
    profiles: ["docker-ai"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai
      args:
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
        - GIT_BRANCH=${GIT_BRANCH:-unknown}
    image: bh-ai:latest
    container_name: bh-ai
    restart: unless-stopped
    network_mode: host
    user: "${USER_UID:-0}:${USER_GID:-0}"
    volumes:
      - /opt/baihua/data:/app/data
      - /opt/baihua/logs:/app/logs
      - /opt/baihua/config/ai:/app/config:ro
      - ${VAULTS_DIR:-/home/lumin/Vaults}:/vaults
    environment:
      - BAIHUA_HOME=/app/data
      - ASPNETCORE_URLS=http://0.0.0.0:8791
      - OpenObserve__WebUrl=http://127.0.0.1:5082/
      - OpenObserve__Enabled=true
      - BAIHUA_VAULT_ROOT=/vaults
      - BAIHUA_ENCRYPTION_KEY=${BAIHUA_ENCRYPTION_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8791/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  openobserve:
    # 可观测性服务（日志/指标），非核心，默认不自动启动
    profiles: ["observability"]
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: bh-openobserve
    restart: unless-stopped
    ports:
      - "5082:5080"
      - "5083:5081"
    volumes:
      - /opt/baihua/data/openobserve:/data
    environment:
      ZO_ROOT_USER_EMAIL: root@localhost.com
      ZO_ROOT_USER_PASSWORD: Complexpass#123
      ZO_DATA_DIR: /data

