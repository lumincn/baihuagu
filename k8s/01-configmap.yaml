# 百花服务共享配置（非敏感）
# 所有服务共享的配置项，通过 ConfigMap 注入环境变量
apiVersion: v1
kind: ConfigMap
metadata:
  name: baihua-config
  namespace: baihua
  labels:
    app.kubernetes.io/part-of: baihua
data:
  # 知识库根路径（容器内挂载点，与 PVC 挂载路径一致）
  BAIHUA_VAULT_ROOT: "/vaults"
  BAIHUA_HOME: "/app/data"

  # OpenObserve 可观测性（如有部署则填实际 URL）
  OpenObserve__WebUrl: "http://openobserve:5080/"
  OpenObserve__Enabled: "true"

  # Nginx 配置
  BAIHUA_NGINX_PORT: "80"
  BAIHUA_WEBUI_PREFIX: ""
  BAIHUA_NGINX_CLIENT_MAX_BODY_SIZE: "100M"

  # Family → Vault/AI 内部通信（K8s Service DNS）
  BAIHUA_VAULT_URL: "http://bh-vault:8790"
  BAIHUA_AI_URL: "http://bh-ai:8791"

  # PostgreSQL（一服务一数据库：family / vault / ai 三库；密码经 Secret 注入 PG_PASSWORD）
  PG_HOST: "bh-postgres"
  PG_USER: "baihua"

  # WebUI → 后端服务（K8s Service DNS）
  FamilyApi__BaseUrl: "http://bh-family:8788/"
  AiApi__BaseUrl: "http://bh-ai:8791/"
  VaultApi__BaseUrl: "http://bh-vault:8790/"

  # OpenVINO 推理服务（bh-openvino = Intel OVMS，K8s Service DNS :8000 REST）
  # Family/AI 通过此 URL 探测 OVMS 是否在托管模型（OpenAI 兼容 /v1/models）
  OPENVINO_LLM_URL: "http://bh-openvino:8000"
  OPENVINO_HOST_URL: "http://bh-openvino:8000"

  # OVMS（OpenVINO Model Server）REST 基地址 —— AI/Family 推理统一走 /v3/chat/completions、/v3/embeddings
  OpenVinoOms__BaseUrl: "http://bh-openvino:8000"
