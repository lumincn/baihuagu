# bh-vault: 知识库管理服务（端口 8790）
# 无 GPU 需求，纯 .NET 服务
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bh-vault
  namespace: baihua
  labels:
    app: bh-vault
    app.kubernetes.io/part-of: baihua
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bh-vault
  template:
    metadata:
      labels:
        app: bh-vault
    spec:
      containers:
        - name: bh-vault
          image: bh-vault:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8790
              name: http
          envFrom:
            - configMapRef:
                name: baihua-config
            - secretRef:
                name: baihua-secret
          env:
            - name: ASPNETCORE_URLS
              value: "http://0.0.0.0:8790"
            - name: BAIHUA_SKIP_MUTEX
              value: "true"
            # 管理 API 访问控制：放行 Pod 网段（Family/WebUI Pod 通过 Service 调用管理 API）
            - name: BAIHUA_ADMIN_ALLOWED_NETS
              value: "10.0.0.0/8"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
            - name: vaults
              mountPath: /vaults
          readinessProbe:
            httpGet:
              path: /health
              port: 8790
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8790
            initialDelaySeconds: 40
            periodSeconds: 30
            failureThreshold: 3
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: baihua-data-pvc
        - name: logs
          persistentVolumeClaim:
            claimName: baihua-logs-pvc
        - name: vaults
          persistentVolumeClaim:
            claimName: baihua-vaults-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bh-vault
  namespace: baihua
  labels:
    app: bh-vault
    app.kubernetes.io/part-of: baihua
spec:
  selector:
    app: bh-vault
  # 固定 ClusterIP：宿主机 DSH/mcp-server 直接经该 IP 访问；固定后不随 Service 重建而改变。
  clusterIP: 10.43.242.109
  ports:
    - name: http
      port: 8790
      targetPort: 8790
      protocol: TCP
