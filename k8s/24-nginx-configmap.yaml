# Nginx 配置 ConfigMap（K8s 专用）
# 适配 K8s Service DNS：upstream 使用服务名 bh-family / bh-webui
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: baihua
  labels:
    app: bh-nginx
    app.kubernetes.io/part-of: baihua
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        client_max_body_size 100M;

        # K8s DNS 解析（kube-dns / CoreDNS）
        # 使用变量形式 proxy_pass 避免启动时 DNS 缓存
        # 注意：必须用 FQDN（短名会被 CoreDNS 转发到上游导致超时）
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
        resolver_timeout 3s;

        set $bh_family_upstream http://bh-family.baihua.svc.cluster.local:8788;
        set $bh_webui_upstream  http://bh-webui.baihua.svc.cluster.local:5177;

        # 安全头部
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 1. Blazor 静态资源（1 年强缓存）
        location ^~ /_framework/ {
            proxy_pass $bh_webui_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location ^~ /css/ {
            proxy_pass $bh_webui_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 7d;
            add_header Cache-Control "public";
        }

        # 2. Blazor SignalR Hub（WebSocket）
        location /hubs/status {
            proxy_pass $bh_webui_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
            proxy_buffering off;
        }

        # 3. 移动端 API（Family 统一授权入口）
        location /mg/ {
            proxy_pass $bh_family_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600;
        }

        location = /pair {
            proxy_pass $bh_family_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /pair/code {
            proxy_pass $bh_family_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /vault/pair {
            proxy_pass $bh_family_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 移动端设备推送 WebSocket
        location /ws/devices {
            proxy_pass $bh_family_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
            proxy_buffering off;
        }

        # 管理侧 API + AI chat（SSE 关缓冲）
        location /api/ {
            proxy_pass $bh_family_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
            proxy_buffering off;
        }

        # WebUI 的认证端点（cli-token/logout 属于 WebUI，不能走 Family）
        location /api/auth/ {
            proxy_pass $bh_webui_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60;
        }

        # Family SignalR hubs
        location /hubs/ {
            proxy_pass $bh_family_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
            proxy_buffering off;
        }

        # 4. WebUI 根路径（最低优先级）
        location / {
            proxy_pass $bh_webui_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_read_timeout 86400;
            proxy_buffering off;
            proxy_cache_bypass $http_upgrade;
        }
    }

  family-proxy-headers.conf: |
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
