# PostgreSQL 存储（一服务一数据库：family/vault/ai 三库独立）
apiVersion: v1
kind: PersistentVolume
metadata:
  name: baihua-postgres-pv
  labels:
    app.kubernetes.io/part-of: baihua
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /opt/baihua/postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: baihua-postgres-pvc
  namespace: baihua
  labels:
    app.kubernetes.io/part-of: baihua
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 10Gi
  volumeName: baihua-postgres-pv
---
apiVersion: v1
kind: Secret
metadata:
  name: baihua-pg-secret
  namespace: baihua
  labels:
    app.kubernetes.io/part-of: baihua
type: Opaque
stringData:
  POSTGRES_PASSWORD: "Baihua2026Pg!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bh-postgres
  namespace: baihua
  labels:
    app.kubernetes.io/part-of: baihua
    app: bh-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bh-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: bh-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: lumin-ubuntu
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: baihua-pg-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              value: "baihua"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "baihua"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "baihua"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: baihua-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bh-postgres
  namespace: baihua
  labels:
    app.kubernetes.io/part-of: baihua
spec:
  selector:
    app: bh-postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
