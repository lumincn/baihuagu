# bh-nginx: 反向代理 + 统一入口（NodePort 30080 → 集群外访问）
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bh-nginx
  namespace: baihua
  labels:
    app: bh-nginx
    app.kubernetes.io/part-of: baihua
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bh-nginx
  template:
    metadata:
      labels:
        app: bh-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-logs
              mountPath: /var/log/nginx
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: nginx-logs
          persistentVolumeClaim:
            claimName: baihua-logs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bh-nginx
  namespace: baihua
  labels:
    app: bh-nginx
    app.kubernetes.io/part-of: baihua
spec:
  type: NodePort
  selector:
    app: bh-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
