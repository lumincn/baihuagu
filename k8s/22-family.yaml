# bh-family: 核心家庭服务（端口 8788）
# OpenVINO 推理已拆分到 bh-openvino 独立服务
# Family 通过 K8s Service DNS (http://bh-openvino:8000) 调用 OpenVINO API
# 不再需要 Intel GPU 资源
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bh-family
  namespace: baihua
  labels:
    app: bh-family
    app.kubernetes.io/part-of: baihua
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bh-family
  template:
    metadata:
      labels:
        app: bh-family
    spec:
      containers:
        - name: bh-family
          image: bh-family:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8788
              name: http
          envFrom:
            - configMapRef:
                name: baihua-config
            - secretRef:
                name: baihua-secret
          env:
            - name: ASPNETCORE_URLS
              value: "http://0.0.0.0:8788"
            - name: TASKRUNNER_SKIP_MUTEX
              value: "true"
            # OpenVINO 远程服务 URL（K8s Service DNS）
            # 设为非 localhost 时，Family 跳过本地 Python 进程启动，直接调用远程 API
            - name: OPENVINO_LLM_URL
              value: "http://bh-openvino:8000"
            - name: OPENVINO_VISION_URL
              value: "http://bh-openvino:8801"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
            - name: vaults
              mountPath: /vaults
            # OpenVINO 模型目录（只读挂载，用于扫描可用模型列表）
            - name: models
              mountPath: /opt/baihua/models
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8788
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8788
            initialDelaySeconds: 40
            periodSeconds: 30
            failureThreshold: 3
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: baihua-data-pvc
        - name: logs
          persistentVolumeClaim:
            claimName: baihua-logs-pvc
        - name: vaults
          persistentVolumeClaim:
            claimName: baihua-vaults-pvc
        - name: models
          persistentVolumeClaim:
            claimName: baihua-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bh-family
  namespace: baihua
  labels:
    app: bh-family
    app.kubernetes.io/part-of: baihua
spec:
  selector:
    app: bh-family
  ports:
    - name: http
      port: 8788
      targetPort: 8788
      protocol: TCP
