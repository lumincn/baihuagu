# kind cluster config for baihua K8s testing
# Maps host directories into kind node for hostPath PVs
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: baihua
nodes:
  - role: control-plane
    # Expose NodePort 30080 on host
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
    # Mount host directories for hostPath PVs
    extraMounts:
      - hostPath: C:\Users\lumin\src\baihuagu\k8s-test-data\data
        containerPath: /opt/baihua/data
      - hostPath: C:\Users\lumin\src\baihuagu\k8s-test-data\logs
        containerPath: /opt/baihua/logs
      - hostPath: C:\Users\lumin\src\baihuagu\k8s-test-data\vaults
        containerPath: /home/lumin/Vaults
      - hostPath: C:\Users\lumin\openvino-models
        containerPath: /opt/baihua/models
