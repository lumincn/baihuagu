# 百花服务敏感配置模板
# 部署前必须填入实际值！
# 生成 ADMIN_PASSWORD_HASH: dotnet run --project services/Baihua.Family -- generate-hash <password>
# 生成 MOBILE_AUTH_SECRET: openssl rand -hex 32
# 生成 BAIHUA_ENCRYPTION_KEY: openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: baihua-secret
  namespace: baihua
  labels:
    app.kubernetes.io/part-of: baihua
type: Opaque
stringData:
  # 管理员密码哈希（BCrypt）
  ADMIN_PASSWORD_HASH: ""

  # 移动端 HMAC 签名密钥
  MobileAuth__SharedSecret: ""

  # 加密密钥（用于加密 API Key 等敏感数据）
  BAIHUA_ENCRYPTION_KEY: ""

  # 管理员 IP 白名单（逗号分隔，留空=不限）
  ADMIN_IP_WHITELIST: ""
