# bh-embedding: 独立 OpenVINO 嵌入服务（bge-small-zh-v1.5，端口 8002）
# 提供 OpenAI 兼容 /v1/embeddings，供 RAG 语义检索（EmbeddingService 重排）使用
# 用法：kubectl apply -f 22b-embedding.yaml（需先有 baihua-models-pvc 挂载模型）
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bh-embedding
  namespace: baihua
  labels:
    app: bh-embedding
    app.kubernetes.io/part-of: baihua
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bh-embedding
  template:
    metadata:
      labels:
        app: bh-embedding
    spec:
      containers:
        - name: bh-embedding
          image: bh-openvino:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: embedding
          env:
            - name: OPENVINO_MODEL_PATH
              value: "/models/bge-small-zh-v1.5"
            - name: OPENVINO_DEVICE
              value: "CPU"           # 嵌入模型很小，CPU 足够（Arc GPU 留给 LLM/Vision）
            - name: OPENVINO_LLM_PORT
              value: "8002"
            - name: OPENVINO_EXTRA_ARGS
              value: "--task embedding"
            - name: START_VISION
              value: "false"         # 嵌入服务不需要 vision_server
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: baihua-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bh-embedding
  namespace: baihua
  labels:
    app: bh-embedding
    app.kubernetes.io/part-of: baihua
spec:
  selector:
    app: bh-embedding
  ports:
    - port: 8002
      targetPort: 8002
      name: embedding
