# Intel GPU Device Plugin DaemonSet
# 来源: https://github.com/intel/intel-device-plugins-for-kubernetes
#
# 部署后 K8s 节点会注册 intel.com/gpu 扩展资源，
# Pod 可通过 resources.limits.intel.com/gpu 请求 Intel GPU。
#
# 前提条件：
#   1. 节点已安装 Intel GPU 驱动（Linux 内核 i915 模块，通常自带）
#   2. 节点存在 /dev/dri/renderD128 设备节点
#   3. 节点已安装 intel-level-zero / intel-level-zero-gpu 运行时（可选，OpenVINO 推荐）
#
# 验证：
#   kubectl describe node <node> | grep intel
#   # 应看到:  intel.com/gpu: 1
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-gpu-plugin
  namespace: kube-system
  labels:
    app: intel-gpu-plugin
spec:
  selector:
    matchLabels:
      app: intel-gpu-plugin
  template:
    metadata:
      labels:
        app: intel-gpu-plugin
    spec:
      # 仅在有 Intel GPU 的节点上调度
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: intel-gpu-plugin
          image: intel/intel-gpu-plugin:0.32.1
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # 时间片共享模式（多个 Pod 可共享一块 GPU）
            - name: ENABLE_MONITORING
              value: "1"
          volumeMounts:
            - name: devfs
              mountPath: /dev/dri
              readOnly: true
            - name: sysfs
              mountPath: /sys/class/drm
              readOnly: true
            - name: kubeletsockets
              mountPath: /var/lib/kubelet/device-plugins
          resources:
            limits:
              memory: 200Mi
            requests:
              cpu: 100m
              memory: 50Mi
      volumes:
        - name: devfs
          hostPath:
            path: /dev/dri
        - name: sysfs
          hostPath:
            path: /sys/class/drm
        - name: kubeletsockets
          hostPath:
            path: /var/lib/kubelet/device-plugins
